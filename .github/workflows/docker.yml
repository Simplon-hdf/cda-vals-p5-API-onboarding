name: Docker Build and Push

on:
  push:
    branches:
      - develop
    paths:
      - 'api/Dockerfile'
      - 'bot/Dockerfile'
      - 'docker-compose.yml'
      - 'api/**'
      - 'bot/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

     
      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            mzabiullah/onboarding-api:latest
            mzabiullah/onboarding-api:${{ github.sha }}

      #bot
      - name: Build and push Bot image
        uses: docker/build-push-action@v4
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: |
            mzabiullah/onboarding-bot:latest
            mzabiullah/onboarding-bot:${{ github.sha }}

      
      - name: Run docker-compose up
        run: |
          docker-compose up -d
      - name: Wait for Postgres
        run: |
          echo "Waiting for postgres to be ready..."
          for i in {1..20}; do
            if docker exec postgres pg_isready -U myuser -d mydatabase; then
              echo "Postgres is ready!"
              break
            fi
            echo "Postgres is not ready yet, waiting..."
            sleep 3
          done

      - name: Show docker-compose status
         
        run: docker-compose ps

      
      - name: Tear down docker-compose
        if: always()
        run: docker-compose down


